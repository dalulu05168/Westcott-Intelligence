name: Westcott Official News Radar (Review Queue Only)
on:
  schedule:
    # Runs hourly in UTC; collection only, never sends Telegram or ChatGPT notifications.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = list candidates only; queue = commit UNREVIEWED items, never send"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - queue

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: westcott-official-radar-queue
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
      RADAR_MODE: ${{ github.event_name == 'schedule' && 'queue' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run official-feed unit tests (offline)
        run: python -m unittest discover -s integrations/telegram -p "test_news_radar.py"
      - name: Collect candidate links for human review, no Telegram secrets
        run: python integrations/telegram/news_radar.py --mode "$RADAR_MODE"
