name: News AI Inference Access Check (No Send)
on:
  push:
    branches:
      - fix/news-ai-access-probe-20261016
    paths:
      - '.github/workflows/news-github-models-probe.yml'
permissions:
  contents: read
  models: read
jobs:
  model-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check Chinese-only summarization using existing GitHub token
        env:
          GH_MODELS_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.getenv('GH_MODELS_TOKEN', '')
          if not token:
              raise SystemExit('MODEL_ACCESS_NOT_READY: GITHUB_TOKEN absent')
          data = {
              'model': 'openai/gpt-4o',
              'messages': [
                  {'role': 'system', 'content': '用简体中文作答，不作未经证实的事实陈述。'},
                  {'role': 'user', 'content': '请将 “financial disclosure” 翻译为中文，仅回复中文译文。'}
              ],
              'temperature': 0, 'max_tokens': 100,
          }
          req = urllib.request.Request('https://models.github.ai/inference/chat/completions',
              data=json.dumps(data).encode(),
              headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
              method='POST')
          try:
              with urllib.request.urlopen(req, timeout=45) as response:
                  output = json.load(response)
              answer = output['choices'][0]['message']['content']
              chinese = any('\u3400' <= character <= '\u9fff' for character in answer)
              print('GITHUB_MODELS_HTTP: 200')
              print('SIMPLIFIED_CHINESE_CAPABLE:', chinese)
              print('OUTPUT_LENGTH:', len(answer))
              print('NEWS_DISPATCHED: FALSE')
              if not chinese:
                  raise SystemExit('MODEL_OUTPUT_LANGUAGE_FAILURE')
          except urllib.error.HTTPError as exc:
              print('GITHUB_MODELS_HTTP:', exc.code)
              print('MODEL_ACCESS_NOT_READY; NO_NEWS_DISPATCHED')
              raise SystemExit(2)
          except (urllib.error.URLError, ValueError, KeyError, TypeError) as exc:
              print('MODEL_PROBE_ERROR_TYPE:', type(exc).__name__)
              raise SystemExit(2)
          PY
