name: News GitHub Official AI Action Probe (No Send)
on:
  push:
    branches: [fix/news-ai-access-probe-20261016]
    paths: ['.github/workflows/news-official-ai-action-test.yml']
permissions:
  contents: read
  models: read
jobs:
  access-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run official GitHub Models inference action (do not publish)
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o
          prompt: '请用简体中文回答：金融信息披露，且不包含任何虚构的数据。'
          max-tokens: 100
      - name: Check response language only (do not print full response)
        env:
          AI_OUTPUT: '${{ steps.ai.outputs.response }}'
        run: |
          python - <<'PY'
          import os
          response = os.getenv('AI_OUTPUT', '')
          ok = bool(response) and any('\u3400' <= c <= '\u9fff' for c in response)
          print('OFFICIAL_MODEL_ACTION_CHINESE_OK:', ok)
          print('NEWS_SENT: FALSE')
          if not ok:
              raise SystemExit(2)
          PY