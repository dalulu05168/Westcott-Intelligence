name: BVB Short PDF Extractability Proof (No Send)
on:
  push:
    branches: [fix/news-source-diagnostic-20261016]
    paths: ['.github/workflows/bvb-short-pdf-proof.yml']
permissions:
  contents: read
jobs:
  official-pdf-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original text extractors
        run: |
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          python -m pip install 'PyMuPDF>=1.25,<2'
      - name: Verify original one-page PDF extractability (no Telegram)
        run: python integrations/telegram/probe_short_bvb_pdf.py
