name: Dual Markets RO FR | Editorial Preview Only
on:
  workflow_dispatch:
    inputs:
      slot:
        type: choice
        required: true
        default: morning_ro
        options: [morning_ro, morning_fr, hourly_pair]
      dry_run:
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: westcott-dual-market-preview
  cancel-in-progress: false
jobs:
  preview-only:
    # No independent live Telegram path. The existing publisher at :52 handles
    # only reviewed news/approved/*.json after evidence and deduplication checks.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r telegram_news/requirements.txt
      - name: Offline country-specific editorial tests
        run: python -m unittest discover -s telegram_news -p 'test_*.py'
      - name: Preview verified article candidates (NEVER send)
        env:
          DUAL_SLOT: '${{ inputs.slot }}'
          DRY_RUN: 'true'
          OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
          OPENAI_NEWS_MODEL: '${{ vars.OPENAI_NEWS_MODEL }}'
          TWELVE_DATA_API_KEY: '${{ secrets.TWELVE_DATA_API_KEY }}'
          US_INDEX_DOW_SYMBOL: '${{ vars.US_INDEX_DOW_SYMBOL }}'
          US_INDEX_SP500_SYMBOL: '${{ vars.US_INDEX_SP500_SYMBOL }}'
          US_INDEX_NASDAQ_SYMBOL: '${{ vars.US_INDEX_NASDAQ_SYMBOL }}'
        run: python telegram_news/dual_market.py
