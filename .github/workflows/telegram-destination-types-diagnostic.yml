name: Telegram Destination Types Diagnostic (Read Only)
on:
  push:
    branches:
      - diagnostics/telegram-target-types-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-types:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Inspect existing targets without Telegram sending or disclosing IDs
        env:
          TELEGRAM_BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}'
          TELEGRAM_CHAT_ID: '${{ secrets.TELEGRAM_CHAT_ID }}'
          TELEGRAM_PRIVATE_CHAT_ID: '${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}'
        run: python telegram_news/diagnose_destinations.py
