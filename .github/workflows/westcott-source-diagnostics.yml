name: Westcott Read-only Source Diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'integrations/telegram/source_diagnostics.py'
      - '.github/workflows/westcott-source-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python integrations/telegram/source_diagnostics.py
