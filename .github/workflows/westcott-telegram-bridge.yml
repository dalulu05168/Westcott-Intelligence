name: Westcott Telegram Bridge
on:
  pull_request:
    paths:
      - "integrations/telegram/**"
      - "news/approved/**"
      - ".github/workflows/westcott-telegram-bridge.yml"
  workflow_dispatch:
    inputs:
      command:
        description: "discover, verify, smoke, inspect, preview, or publish"
        type: choice
        options:
          - verify
          - discover
          - smoke
          - inspect
          - preview
          - publish
        required: true
        default: verify
      article_url:
        description: "For inspect: news ARTICLE or publisher IMAGE HTTPS URL (JPG/PNG/WebP)"
        type: string
        required: false
        default: ""
      ledger_path:
        description: "For preview/publish: committed reviewed ledger under news/approved/*.json"
        type: string
        required: false
        default: ""
      publish_confirmation:
        description: "For publish only: type PUBLISH_REVIEWED_NEWS (sends image + text)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline transport unit tests
        run: python -m unittest discover -s integrations/telegram -p "test_*.py"

  telegram:
    if: github.event_name == 'workflow_dispatch' && inputs.command != 'preview' && inputs.command != 'publish' && inputs.command != 'inspect'
    needs: tests
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_EXPECTED_BOT_USERNAME: ZhaoCai2026Bot
      TELEGRAM_EXPECTED_GROUP_TITLE: 🌐~~~资讯快报
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}
      COMMAND: ${{ inputs.command }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute explicitly requested Telegram action
        run: python integrations/telegram/bridge.py "$COMMAND"

  reviewed_news:
    if: github.event_name == 'workflow_dispatch' && (inputs.command == 'preview' || inputs.command == 'publish')
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: westcott-telegram-reviewed-publish
      cancel-in-progress: false
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_EXPECTED_BOT_USERNAME: ZhaoCai2026Bot
      TELEGRAM_EXPECTED_GROUP_TITLE: 🌐~~~资讯快报
      TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
      PUBLISH_CONFIRMATION: ${{ inputs.publish_confirmation }}
      NEWS_ANALYSIS_V1_REQUIRED: '1'
      NEWS_LEDGER_PATH: ${{ inputs.ledger_path }}
      COMMAND: ${{ inputs.command }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Review evidence and link the original article image
        run: python integrations/telegram/reviewed_publish.py --mode "$COMMAND" --ledger "$NEWS_LEDGER_PATH"

  inspect_original_article:
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'inspect'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ORIGINAL_NEWS_ARTICLE_URL: ${{ inputs.article_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identify article metadata or recognize publisher image URL
        run: python integrations/telegram/source_media.py --article-url "$ORIGINAL_NEWS_ARTICLE_URL"

