name: Westcott Parallel Morning Briefs (RO+US and FR+US)

on:
  schedule:
    - cron: '30 7 * * 1-5'
      timezone: Europe/Bucharest
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/westcott-morning-opening.yml'
      - 'scripts/morning_opening.py'
      - 'scripts/test_morning_opening.py'
      - 'news/verified-market/**'
      - 'scripts/morning_group_delivery.py'
      - 'scripts/test_morning_group_delivery.py'
      - 'news/approved-morning/**'
      - 'news/approved-morning-france-us/**'
      - 'scripts/morning_france_us.py'
      - 'scripts/test_morning_france_us.py'
      - 'scripts/morning_france_us_delivery.py'
      - 'scripts/morning_romania_us.py'
      - 'scripts/morning_source_intake.py'
      - 'news/morning-intake/**'

permissions:
  contents: read

concurrency:
  group: westcott-morning-opening-preparation
  cancel-in-progress: false

jobs:
  morning-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate official roster and runtime rules
        run: python scripts/validate_repository.py
      - name: Test morning evidence gating
        run: python -m unittest discover -s scripts -p 'test_morning_opening.py' -v
      - name: Test reviewed group delivery safeguards
        run: python -m unittest discover -s scripts -p 'test_morning_group_delivery.py' -v
      - name: Test independent France plus US preparation and delivery safeguards
        run: python -m unittest discover -s scripts -p 'test_morning_france_us.py' -v
      - name: Check today's shared official source-intake handoff
        shell: python
        run: |
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import json, os
          day=datetime.now(ZoneInfo('Europe/Bucharest')).date().isoformat()
          p=Path('news/morning-intake')/(day+'.json')
          msg='HELD_NO_TODAY_OFFICIAL_INTAKE'
          if p.exists():
              d=json.loads(p.read_text(encoding='utf-8'))
              if d.get('local_date')==day and d.get('review_status')=='UNREVIEWED':
                  counts={x:sum(x in c.get('market_scopes',[]) and c.get('evidence_status')=='BODY_CAPTURED_UNREVIEWED'
                    for c in d.get('candidates',[])) for x in ('RO','FR','US')}
                  msg='OFFICIAL_CANDIDATES_UNREVIEWED_'+str(counts)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('### 原始官方来源交接（不等于事实审稿）\\n'+msg+'\\n')
          print(msg)
      - name: Prepare morning opening and US previous close candidate
        run: |
          python scripts/morning_opening.py \
            --source news/verified-market/us-close-latest.json \
            --output morning-review.json \
            --text-output morning-review.txt
      - name: Prepare parallel France + US morning candidate (review only)
        run: |
          python scripts/morning_france_us.py \
            --us-source news/verified-market/us-close-latest.json \
            --fr-source news/verified-market/france-morning-latest.json \
            --output morning-france-review.json \
            --text-output morning-france-review.txt
      - name: Prepare Romania + US morning candidate with separate local news
        run: |
          python scripts/morning_romania_us.py \
            --us-source news/verified-market/us-close-latest.json \
            --ro-source news/verified-market/romania-morning-latest.json \
            --output morning-romania-review.json \
            --text-output morning-romania-review.txt
      - name: France + US review-only summary
        if: always()
        run: |
          if [ -f morning-france-review.json ]; then
            echo '## France + US morning draft — not delivered' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json,os; x=json.load(open("morning-france-review.json")); f=open(os.environ["GITHUB_STEP_SUMMARY"],"a"); f.write("- 状态："+x["status"]+"\n- "+x["reason"]+"\n- 法国/美国备稿与罗马尼亚/美国分别审核、分别去重。\n")'
          fi
      - name: Report real preparation status
        if: always()
        run: |
          echo '## Westcott morning opening (review only)' >> "$GITHUB_STEP_SUMMARY"
          if [ -f morning-review.json ]; then
            python -c 'import json,os; d=json.load(open("morning-review.json")); f=open(os.environ["GITHUB_STEP_SUMMARY"],"a"); f.write("- 状态："+d["status"]+"\n- "+d["reason"]+"\n- 未发送 Telegram；未写入 Google Docs；未批准成员对白。\n")'
          else
            echo '- 未生成审核材料，见 Actions 日志。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Show the draft in GitHub Actions summary (no storage cost)
        if: always()
        run: |
          if [ -f morning-review.txt ]; then
            echo '### 可复制的早间候选稿（未经发布批准）' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            cat morning-review.txt >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi

  approved-telegram-delivery:
    # Never expose Telegram credentials to pull requests or manual previews.
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: morning-preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: westcott-morning-reviewed-telegram-delivery
      cancel-in-progress: false
    env:
      GITHUB_REF_NAME: ${{ github.ref_name }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}
      TELEGRAM_EXPECTED_BOT_USERNAME: ZhaoCai2026Bot
      TELEGRAM_EXPECTED_GROUP_TITLE: 🌐~~~资讯快报
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Only approved, current-date briefing may be sent to verified group
        run: python scripts/morning_group_delivery.py

  approved-france-us-telegram-delivery:
    # France is an independent edition. No pull_request/manual dispatch may send.
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: morning-preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: westcott-morning-france-us-reviewed-delivery
      cancel-in-progress: false
    env:
      GITHUB_REF_NAME: ${{ github.ref_name }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}
      TELEGRAM_EXPECTED_BOT_USERNAME: ZhaoCai2026Bot
      TELEGRAM_EXPECTED_GROUP_TITLE: 🌐~~~资讯快报
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Only reviewed France + US morning briefing may enter the same group
        run: python scripts/morning_france_us_delivery.py
