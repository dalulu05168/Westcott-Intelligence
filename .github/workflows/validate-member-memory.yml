name: Validate Westcott member memory
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate canonical members
        run: python scripts/validate_repository.py
      - name: Validate 65-person runtime projection
        run: python -m unittest discover -s scripts -p test_runtime_context.py -v
      - name: Validate editorial execution and fact gate regressions
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Audit 65 profiles and long-term evidence
        run: python scripts/validate_member_p1.py
      - name: Review P2 scene evidence without semantic auto-approval
        run: python scripts/validate_scene_p2.py
      - name: Publish P1 audit summary
        if: always()
        run: |
          if [ -f audit/member-p1-validation.json ]; then
            echo '## Westcott P1 member audit' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json; a=json.load(open("audit/member-p1-validation.json")); print("Profiles: %s/65; memory files: %s; errors: %s; warnings: %s" % (a["profiles_checked"],a["memory_files_checked"],len(a["errors"]),a["warnings"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check all five prepared task prompts and hashes
        run: python scripts/sync_runtime_memory.py --check
