name: Westcott Morning Official Source Intake (No Send)

on:
  schedule:
    - cron: '45 6 * * 1-5'
      timezone: Europe/Bucharest
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/westcott-morning-source-intake.yml'
      - 'scripts/morning_source_intake.py'
      - 'scripts/test_morning_source_intake.py'
permissions:
  contents: read
concurrency:
  group: westcott-official-morning-intake
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      INTAKE_MODE: ${{ github.event_name == 'schedule' && 'queue' || 'dry-run' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source integrity and no-publish rules
        run: python -m unittest discover -s scripts -p 'test_morning_source_intake.py' -v
      - name: Capture morning primary-source items (never reviewed, never sent)
        run: python scripts/morning_source_intake.py --mode "$INTAKE_MODE"
